# Render Blueprint: AiRouter (9Router + Auto Tor IP changer)
# autoDeploy: true means pushing to main triggers a new deploy automatically.
# No manual restart needed when code/webpage changes.
services:
  - type: web
    name: ai-router
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: 10000
      # 9Router dashboard login (native mechanism, read by /api/auth/login).
      - key: INITIAL_PASSWORD
        value: sakib
      # Freebuff OpenAI-compatible provider (imported at startup by run.py).
      - key: FREEBUFF_ENABLED
        value: "1"
      - key: FREEBUFF_BASE_URL
        value: https://freebuff.llm.pm/v1
      - key: FREEBUFF_API_KEY
        value: ""
